name: .NET Unit Tests

# Workflow запускається при push у гілки feature/* та develop,
# а також при створенні pull request у develop.
on:
  push:
    branches:
      - 'feature/*'
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Крок 1: завантаження коду з репозиторію
      - name: Checkout code
        uses: actions/checkout@v4

      # Крок 2: встановлення .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Крок 3: відновлення залежностей
      - name: Restore dependencies
        run: dotnet restore SonarNet.slnx

      # Крок 4: компіляція (без повторного відновлення залежностей)
      - name: Build
        run: dotnet build SonarNet.slnx --no-restore

      # Крок 5: запуск модульних тестів
      - name: Run unit tests
        run: dotnet test SonarNet.slnx --no-build --verbosity normal
